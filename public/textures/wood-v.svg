<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- Древесные волокна: шум, сильно вытянутый вдоль рамки. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.32 0.004" numOctaves="4" seed="9" stitchTiles="stitch" />
    <feColorMatrix values="0 0 0 0 0.24  0 0 0 0 0.13  0 0 0 0 0.05  0 0 0 1.9 -0.55" />
  </filter>
  <filter id="fine" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.32 0.004" numOctaves="2" seed="21" stitchTiles="stitch" />
    <feColorMatrix values="0 0 0 0 0.95  0 0 0 0 0.75  0 0 0 0 0.5  0 0 0 2.2 -1.15" />
  </filter>
  <rect width="600" height="600" fill="#9a6232" />
  <rect width="600" height="600" filter="url(#fine)" />
  <rect width="600" height="600" filter="url(#grain)" />
</svg>
